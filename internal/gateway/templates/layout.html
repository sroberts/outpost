{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#141a21">
{{if .Refresh}}<meta http-equiv="refresh" content="3">{{end}}
{{if .Poll}}<noscript><meta http-equiv="refresh" content="3"></noscript>{{end}}
{{if .SelfPoll}}<noscript><meta http-equiv="refresh" content="5"></noscript>{{end}}
<title>{{.Title}} · {{.Portal}}</title>
<link rel="stylesheet" href="{{.CSS}}">
{{if .Who}}<script src="{{.MenusJS}}" defer></script>{{end}}
</head>
<body>
{{template "body" .}}
{{if .Who}}<footer class="foot">Outpost {{.Version}}</footer>
{{end}}</body>
</html>
{{end}}
{{define "rail"}}<header class="rail">
<div class="rail-in">
<a class="home" href="{{.Home}}"><span class="sr">Apps on </span>{{.Host}}</a>
{{if .Who}}<nav class="acct" aria-label="Account">
<a class="pill" href="/account"><span class="sr">Account: </span>{{.Who}}</a>
<form method="post" action="/logout"><button class="pill quiet" type="submit">Sign out</button></form>
</nav>{{end}}
</div>
</header>{{end}}
