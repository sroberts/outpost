{{define "body"}}
<main class="door">
<div class="hub">
<span class="lamp" aria-hidden="true"></span>
<h1>Set up {{.Portal}}</h1>
<p class="tally">{{.Host}}</p>
</div>
<section class="panel" aria-labelledby="first">
<h2 id="first">Create the first admin</h2>
<p class="lede">This link works once, until an admin exists or the daemon restarts.</p>
{{if .Error}}<p class="error" id="form-error" role="alert">{{.Error}}</p>{{end}}
<form method="post" action="/setup">
<input type="hidden" name="token" value="{{.Token}}">
<label>Username
<input name="username" value="{{.Username}}" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus{{if .Error}} aria-describedby="form-error"{{end}}>
</label>
<label>Password <span class="hint">at least {{.MinPassword}} characters</span>
<input name="password" type="password" autocomplete="new-password" minlength="{{.MinPassword}}" required{{if .Error}} aria-describedby="form-error"{{end}}>
</label>
<label>Password again
<input name="confirm" type="password" autocomplete="new-password" minlength="{{.MinPassword}}" required>
</label>
<button type="submit">Create admin</button>
</form>
</section>
</main>
{{end}}
