{{define "body"}}
<main class="door">
<img class="plate" src="{{.Art}}" alt="" width="760" height="243">
<div class="hub bare">
<h1>{{.Portal}}</h1>
<p class="tally">{{.Host}}</p>
</div>
<section class="panel" aria-labelledby="signin">
<h2 id="signin">Sign in</h2>
{{if .App}}<p class="lede">to continue to <strong>{{.AppTitle}}</strong></p>{{end}}
{{if .Notice}}<p class="notice" role="status">{{.Notice}}</p>{{end}}
{{if .Error}}<p class="error" id="form-error" role="alert">{{.Error}}</p>{{end}}
<form method="post" action="/login">
<input type="hidden" name="app" value="{{.App}}">
<input type="hidden" name="next" value="{{.Next}}">
<label>Username
<input name="username" value="{{.Username}}" autocomplete="username" autocapitalize="none" spellcheck="false" required{{if .Error}} aria-invalid="true" aria-describedby="form-error"{{end}}{{if not .Username}} autofocus{{end}}>
</label>
<label>Password
<input name="password" type="password" autocomplete="current-password" required{{if .Error}} aria-invalid="true" aria-describedby="form-error"{{end}}{{if .Username}} autofocus{{end}}>
</label>
<button type="submit">Sign in</button>
</form>
</section>
</main>
{{end}}
