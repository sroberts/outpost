{{define "body"}}
<main class="narrow">
<h1>Sign in</h1>
{{if .App}}<p class="lede">to continue to <strong>{{.App}}</strong></p>{{end}}
{{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
<form method="post" action="/login">
<input type="hidden" name="app" value="{{.App}}">
<input type="hidden" name="next" value="{{.Next}}">
<label>Username
<input name="username" value="{{.Username}}" autocomplete="username" autocapitalize="none" spellcheck="false" required{{if not .Username}} autofocus{{end}}>
</label>
<label>Password
<input name="password" type="password" autocomplete="current-password" required{{if .Username}} autofocus{{end}}>
</label>
<button type="submit">Sign in</button>
</form>
</main>
{{end}}
