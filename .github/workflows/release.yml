name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CGO_ENABLED: "0"

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Pure Go with cgo off cross-compiles from one runner, and the output is
      # statically linked — the property that lets Outpost be dropped onto a
      # box with no toolchain.
      #
      # No version is stamped into the binary yet; once issue #12 lands, the
      # -ldflags "-X ..." belongs here.
      - name: Build
        run: |
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            echo "building $os/$arch"
            GOOS="$os" GOARCH="$arch" go build -trimpath \
              -o "dist/outpost-${os}-${arch}" ./cmd/outpost
          done
          cd dist && sha256sum outpost-* > SHA256SUMS && cat SHA256SUMS

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
