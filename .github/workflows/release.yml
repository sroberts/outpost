name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  binaries:
    runs-on: ubuntu-latest
    # Scoped to the one job that needs them: contents to create the release,
    # id-token and attestations to sign the provenance for what it publishes.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No module cache: a cache restored into a release build is an input
      # nobody reviewed, and the binaries are what users run.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # Pure Go with cgo off cross-compiles from one runner, and the output is
      # statically linked — the property that lets Outpost be dropped onto a
      # box with no toolchain.
      #
      # The tag is stamped in so a released binary reports its own version
      # rather than the pseudo-version the toolchain derives.
      - name: Build
        run: |
          mkdir -p dist
          V=github.com/sroberts/outpost/internal/version
          LDFLAGS="-X $V.Version=${GITHUB_REF_NAME}"
          LDFLAGS="$LDFLAGS -X $V.Commit=${GITHUB_SHA}"
          LDFLAGS="$LDFLAGS -X $V.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            echo "building $os/$arch"
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "$LDFLAGS" \
              -o "dist/outpost-${os}-${arch}" ./cmd/outpost
          done
          ./dist/outpost-linux-amd64 --version || true
          cd dist && sha256sum outpost-* > SHA256SUMS && cat SHA256SUMS

      # Provenance ties each binary to this workflow run and commit, which a
      # SHA256SUMS file published alongside them cannot.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
